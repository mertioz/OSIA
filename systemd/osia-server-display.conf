# OSIA — systemd display override (NO LONGER NEEDED)
# ===========================================================================
# This file is REFERENCE DOCUMENTATION, not an active unit/drop-in.
# DO NOT install it into /etc/systemd/system.
#
# It documents a manual systemd drop-in that USED to be required so the
# osia-server.service could reach the X11 display for CDP / Firefox-BiDi
# browser automation. That override is now obsolete: the server resolves
# DISPLAY + XAUTHORITY by itself at startup.
#   -> osia/server/server.py :: _ensure_x11_env()
#      (called from the FastAPI "startup" event, before any browser tool runs)
#
# ---------------------------------------------------------------------------
# Why the old override broke after every reboot
# ---------------------------------------------------------------------------
# The per-session X authority cookie lives at:
#     /run/user/<uid>/xauth_XXXXXX
# where the "XXXXXX" suffix is RANDOM and changes on every login/reboot. A
# hardcoded XAUTHORITY path in a systemd drop-in therefore went stale after
# the next reboot, and browser tools stopped working until it was fixed by
# hand. The server now globs /run/user/<uid>/xauth_* (newest match wins, with
# ~/.Xauthority as a fallback) at startup, so no hardcoded path is involved.
#
# ---------------------------------------------------------------------------
# The old manual override (for reference) lived at:
#     /etc/systemd/system/osia-server.service.d/display.conf
# and looked roughly like this:
#
#     [Service]
#     Environment=DISPLAY=:0
#     Environment=XAUTHORITY=/run/user/1000/xauth_abc123   # <- went stale!
#
# ---------------------------------------------------------------------------
# How to remove the stale override (one time)
# ---------------------------------------------------------------------------
#     sudo rm -f /etc/systemd/system/osia-server.service.d/display.conf
#     # remove the drop-in dir too if nothing else lives in it:
#     sudo rmdir --ignore-fail-on-non-empty /etc/systemd/system/osia-server.service.d
#     sudo systemctl daemon-reload
#     sudo systemctl restart osia-server
#
# After this, browser tools work after every reboot with no manual steps.
# Confirm in the journal that the server self-resolved the display:
#     journalctl -u osia-server -e | grep '\[X11\]'
# expected, e.g.:
#     [X11] DISPLAY=:0 XAUTHORITY=/run/user/1000/xauth_XXXXXX

name: Build macOS portable
on:
  workflow_dispatch:
    inputs:
      source_commit:
        description: Desktop source commit to build (defaults to this workflow revision)
        required: false
        type: string
permissions:
  contents: read
jobs:
  apple-silicon:
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ inputs.source_commit || github.sha }}
          persist-credentials: false
      - name: Prepare native runtime
        run: bash packaging/portable/prepare_macos.sh "$RUNNER_TEMP/osia-runtime"
      - name: Build application and archive
        run: |
          "$RUNNER_TEMP/osia-runtime/bundle/python/bin/python3.12" -I -B packaging/portable/build_unix.py "$RUNNER_TEMP/osia-runtime/bundle" "$RUNNER_TEMP/portable-output"
      - name: Extract and launch on macOS
        run: |
          mkdir -p "$HOME/Applications/OSIA portable test"
          tar -xzf "$RUNNER_TEMP/portable-output/OSIA.tar.gz" -C "$HOME/Applications/OSIA portable test"
          app="$HOME/Applications/OSIA portable test/OSIA.app"
          codesign --verify --strict "$app"
          "$app/Contents/MacOS/OSIA" --doctor
          python3 packaging/portable/smoke.py "$app/Contents/MacOS/OSIA" --check-login
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: OSIA-macos-arm64
          path: ${{ runner.temp }}/portable-output/
          compression-level: 0
          if-no-files-found: error
          retention-days: 5
